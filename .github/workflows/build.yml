name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trabalhos/equipe-trio
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make build
      - name: Testes
        run: make test
      - name: Testes com sanitizers
        run: make test SANITIZE=1
